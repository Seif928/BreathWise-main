version: "2"
type: backend
tech_stack:
  - Python
  - Django
  - Django REST Framework
  - SQLite
features:
  - name: User Authentication & Profile API
    description: Register, login, logout, profile management and password reset operations
    files:
      - user/views.py
      - user/urls.py
      - user/models.py
    endpoints:
      - method: POST
        path: /api/register/
        description: Register a new user
        auth_required: false
      - method: POST
        path: /api/login/
        description: Authenticate user and get tokens
        auth_required: false
      - method: POST
        path: /api/logout/
        description: Logout user and blacklist refresh token
        auth_required: true
      - method: GET
        path: /api/profile/
        description: Get current user profile
        auth_required: true
      - method: POST
        path: /api/password-reset/
        description: Request password reset email
        auth_required: false
      - method: POST
        path: /api/password-reset/confirm/
        description: Confirm password reset with token
        auth_required: false
    depends_on: []
known_limitations: []
